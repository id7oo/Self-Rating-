<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PEC Self-Rating</title>
<meta name="description" content="Discover your 10 Personal Entrepreneurial Competencies with the standard PEC self-rating questionnaire. اكتشف كفاءاتك الريادية الشخصية العشر.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one focused column; a single statement card at a time, then a profile sheet that mirrors the paper PEC chart (0–25 scale, X's joined by a line). */
:root{
  --bg:#EDF0F5;
  --surface:#FFFFFF;
  --ink:#0E1A2F;
  --muted:#5A6680;
  --line:#D5DBE6;
  --accent:#F2541B;
  --accent-ink:#FFFFFF;
  --accent-soft:#FDE3D8;
  --sky:#2F6BFF;
  --good:#12936A;
  --gold:#C98A00;
  --shadow:0 1px 2px rgba(14,26,47,.06),0 12px 32px -12px rgba(14,26,47,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-label:var(--f-mono);
  --dx:40px;
  --r:18px;
}
:root[lang="ar"]{
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --f-label:var(--f-body);
  --dx:-40px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220;--surface:#141D2F;--ink:#EAF0FA;--muted:#93A0B8;--line:#26324A;
    --accent:#FF6A33;--accent-ink:#1A0B04;--accent-soft:#3A1F17;--sky:#6E9BFF;--good:#3CCB97;--gold:#F0B83A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#141D2F;--ink:#EAF0FA;--muted:#93A0B8;--line:#26324A;
  --accent:#FF6A33;--accent-ink:#1A0B04;--accent-soft:#3A1F17;--sky:#6E9BFF;--good:#3CCB97;--gold:#F0B83A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
:root[lang="ar"] h1,:root[lang="ar"] h2,:root[lang="ar"] h3{letter-spacing:0;line-height:1.25}
.eyebrow{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .eyebrow{font-size:14px;letter-spacing:0;font-weight:600}
.flip{transition:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* language toggle */
.langbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[lang="ar"]{font-family:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif}
.seg button[lang="en"]{font-family:"Figtree",system-ui,sans-serif}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;
  padding:16px 28px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);
  transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 8px 20px -8px var(--accent);
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink)}

/* ---------- Intro ---------- */
.intro{display:grid;gap:28px;padding-top:2vh}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em}
:root[lang="ar"] .mark{letter-spacing:0;font-size:15px}
.mark i{width:auto;padding-inline:7px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:12px;font-family:var(--f-mono)}
.intro h1{font-size:clamp(40px,9vw,72px);line-height:.95;font-weight:800}
:root[lang="ar"] .intro h1{font-size:clamp(36px,8.5vw,64px);line-height:1.35;font-weight:700}
.intro h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:18px;color:var(--muted);max-width:52ch;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--f-label);font-size:13px;color:var(--muted)}
:root[lang="ar"] .facts{font-size:15px}
.facts b{color:var(--ink);font-size:15px;font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
:root[lang="ar"] .chip{font-size:14px}
.scale-hint{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:460px}
.scale-hint div{text-align:center;font-size:12px;color:var(--muted)}
:root[lang="ar"] .scale-hint div{font-size:13px}
.scale-hint b{display:block;font-family:var(--f-mono);font-size:18px;color:var(--ink)}

/* ---------- Quiz ---------- */
.quiz{display:grid;gap:22px;padding-top:8px}
.topbar{display:flex;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.stages{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stage{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.stage span{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--accent);border-radius:inherit;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.stage.done span{background:var(--good)}
.count{font-family:var(--f-mono);font-size:14px;font-weight:700;min-width:62px;text-align:end;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.count small{color:var(--muted);font-weight:500}
.card{
  background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,44px);
  min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;overflow:hidden;
}
.card .qnum{font-family:var(--f-label);font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
:root[lang="ar"] .card .qnum{letter-spacing:0;font-size:15px}
.card .qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(23px,4.6vw,32px);line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
:root[lang="ar"] .card .qtext{font-weight:500;line-height:1.55;letter-spacing:0;font-size:clamp(22px,4.4vw,30px)}
.card.in{animation:cardIn .38s cubic-bezier(.2,.8,.2,1)}
.card.back{animation:cardBack .38s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
@keyframes cardBack{from{opacity:0;transform:translateX(calc(var(--dx) * -1))}to{opacity:1;transform:none}}
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ans{
  border:0;background:var(--surface);border-radius:var(--r);padding:14px 6px 12px;display:grid;gap:4px;justify-items:center;
  box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .12s ease,box-shadow .15s ease,background .15s ease;
}
.ans b{font-family:var(--f-mono);font-size:22px;line-height:1}
.ans span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.2}
:root[lang="ar"] .ans span{font-size:14px}
.ans:hover{box-shadow:inset 0 0 0 2px var(--ink);transform:translateY(-2px)}
.ans.sel{background:var(--accent);box-shadow:none}
.ans.sel b,.ans.sel span{color:var(--accent-ink)}
.ans.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.kbd-hint{text-align:center;font-size:13px;color:var(--muted)}
.kbd-hint kbd{font-family:var(--f-mono);font-size:12px;padding:2px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:560px){
  .answers{grid-template-columns:1fr;gap:8px}
  .ans{grid-template-columns:36px 1fr;justify-items:start;align-items:center;padding:14px 18px;text-align:start}
  .ans span,:root[lang="ar"] .ans span{font-size:16px;color:var(--ink)}
  .kbd-hint{display:none}
  .card{min-height:180px}
}

/* toast */
.toast{
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:20;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;display:flex;gap:12px;align-items:center;
  box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,1.4,.4,1);max-width:calc(100% - 32px);
}
.toast.show{transform:translate(-50%,0)}
.toast .medal{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;flex:none}
.toast b{display:block;font-family:var(--f-display);font-size:16px}
.toast small{opacity:.75}

/* ---------- Results ---------- */
.results{display:grid;gap:22px}
.hero{
  background:var(--ink);color:var(--bg);border-radius:32px;padding:clamp(24px,6vw,44px);display:grid;gap:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.55;pointer-events:none;
}
.hero .eyebrow{color:inherit;opacity:.7}
.hero h1{font-size:clamp(38px,9vw,64px);line-height:.95;font-weight:800}
:root[lang="ar"] .hero h1{line-height:1.25;font-weight:700;font-size:clamp(34px,8vw,56px)}
.hero p{margin:0;opacity:.82;max-width:48ch}
.hero-stats{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:flex-end;position:relative;z-index:1}
.big{font-family:var(--f-mono);font-weight:700;font-size:clamp(44px,11vw,68px);line-height:1;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.big small{font-size:.38em;opacity:.6}
.tier{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.tierbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:min(260px,100%)}
.tierbar i{height:6px;border-radius:9px;background:currentColor;opacity:.2}
.tierbar i.on{opacity:1;background:var(--accent)}
.tierlbl{font-family:var(--f-label);font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
:root[lang="ar"] .tierlbl{font-size:13px;letter-spacing:0}

.panel{background:var(--surface);border-radius:28px;padding:clamp(20px,5vw,32px);box-shadow:var(--shadow);display:grid;gap:18px;min-width:0}
.panel h2{font-size:24px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
:root[lang="ar"] .legend{font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

.profile{position:relative;display:grid;gap:14px}
.profile svg.link{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 2fr;gap:6px 16px;align-items:center}
.plabel{font-weight:600;font-size:14.5px;line-height:1.25;display:flex;justify-content:space-between;gap:8px;min-width:0}
.plabel .val{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.track{position:relative;height:30px;border-radius:10px;direction:ltr;
  background:
    linear-gradient(90deg,transparent calc(20% - 1px),var(--line) calc(20% - 1px),var(--line) 20%,transparent 20%,transparent calc(40% - 1px),var(--line) calc(40% - 1px),var(--line) 40%,transparent 40%,transparent calc(60% - 1px),var(--line) calc(60% - 1px),var(--line) 60%,transparent 60%,transparent calc(80% - 1px),var(--line) calc(80% - 1px),var(--line) 80%,transparent 80%),
    var(--bg);}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;width:0;opacity:.22;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.dot{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:#fff;
  transition:left 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 3px var(--surface);z-index:2}
.lv-strong{--c:var(--good)} .lv-solid{--c:var(--sky)} .lv-grow{--c:var(--accent)}
.prow .dot,.prow .fill{background:var(--c)}
.axis{display:grid;grid-template-columns:minmax(0,1fr) 2fr;gap:16px}
.axis div:last-child{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);direction:ltr}
@media (max-width:560px){
  .prow,.axis{grid-template-columns:1fr}
  .axis div:first-child{display:none}
  .profile svg.link{display:none}
}

.cards2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:640px){.cards2{grid-template-columns:1fr}}
.list{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px}
.badge.s{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.g{background:var(--accent-soft);color:var(--accent)}
.list b{display:block;font-size:15px}
.list p{margin:2px 0 0;font-size:14px;color:var(--muted)}
:root[lang="ar"] .list p{font-size:15px;line-height:1.7}

.honesty{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.gauge{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:20px;
  background:conic-gradient(var(--hc) calc(var(--p)*1%),var(--line) 0);position:relative}
.gauge::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.gauge span{position:relative}
.honesty p{margin:0;font-size:14.5px;color:var(--muted)}
:root[lang="ar"] .honesty p{font-size:15px;line-height:1.75}
.honesty b{color:var(--ink)}

details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.tablewrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:end;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:start;white-space:normal}
th{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
:root[lang="ar"] th{font-size:13px;letter-spacing:0;font-weight:600}
td.num{direction:ltr;unicode-bidi:isolate}
tfoot td{font-weight:700;border-bottom:0}

.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.note{text-align:center;font-size:13px;color:var(--muted);margin:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"><div class="medal" id="toastMedal">1</div><div><b id="toastTitle"></b><small id="toastSub"></small></div></div>

<main class="wrap">
  <div class="langbar">
    <div class="seg" role="group" aria-label="Language / اللغة">
      <button type="button" id="langEn" data-lang="en" lang="en" aria-pressed="true">English</button>
      <button type="button" id="langAr" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
    </div>
  </div>

  <!-- INTRO -->
  <section class="intro" id="intro">
    <div class="mark"><i>PEC</i><span data-i18n="mark"></span></div>
    <h1 data-i18n-html="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="facts">
      <span><b>55</b> <span data-i18n="fStatements"></span></span>
      <span><b>~8</b> <span data-i18n="fMinutes"></span></span>
      <span><b>10</b> <span data-i18n="fComp"></span></span>
    </div>
    <div class="chips" id="chips"></div>
    <div>
      <div class="eyebrow" style="margin-bottom:10px" data-i18n="howTrue"></div>
      <div class="scale-hint" id="scaleHint"></div>
    </div>
    <div><button class="btn" id="startBtn" type="button"><span data-i18n="start"></span>
      <svg class="flip" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <p class="lede" style="font-size:15px" data-i18n="honestNote"></p>
  </section>

  <!-- QUIZ -->
  <section class="quiz" id="quiz" hidden>
    <div class="topbar">
      <button class="iconbtn" id="backBtn" type="button" data-i18n-aria="prev">
        <svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <div class="stages" id="stages" aria-hidden="true"></div>
      <div class="count" id="count">1<small>/55</small></div>
    </div>
    <div><span class="eyebrow" id="stageLabel"></span></div>
    <article class="card in" id="card" aria-live="polite">
      <div class="qnum" id="qnum"></div>
      <div class="qtext" id="qtext"></div>
    </article>
    <div class="answers" id="answers" role="group"></div>
    <div class="kbd-hint" data-i18n-html="kbd"></div>
  </section>

  <!-- RESULTS -->
  <section class="results" id="results" hidden>
    <div class="hero">
      <div class="eyebrow" data-i18n="yourType"></div>
      <h1 id="archetype"></h1>
      <p id="archetypeDesc"></p>
      <div class="hero-stats">
        <div>
          <div class="big"><span id="totalNum">0</span><small>/250</small></div>
          <div class="tierlbl" data-i18n="corrScore"></div>
        </div>
        <div>
          <div class="tier" id="tierName"></div>
          <div class="tierbar" id="tierBar" style="margin-top:10px"><i></i><i></i><i></i><i></i></div>
          <div class="tierlbl" id="tierRow"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="profile"></h2>

  yourType:"نمطك الريادي", corrScore:"مجموع الكفاءات بعد التصحيح",
  tiers:["البداية","الاستكشاف","البناء","الريادة"], level:(n,t)=>`المستوى ${n} · ${t}`,
  topIs:n=>` أقوى كفاءاتك: ${n}.`,
  profile:"ملف كفاءاتك الريادية", lgStrong:"قوية: 20 فأكثر", lgSolid:"جيدة: 15–19", lgGrow:"قيد النمو: أقل من 15",
  of25:(n,v)=>`${n}: ${v} من 25`,
  strengths:"أبرز نقاط قوتك", growth:"فرص التطوير", honesty:"مؤشر المصداقية",
  cfHigh:(cf,c)=>`معامل التصحيح لديك <b>${cf}</b>، وهذا يشير إلى أن تقييمك لنفسك جاء إيجابيًا بدرجة كبيرة. ولتكون النتائج أقرب إلى الواقع، خُصمت <b>${c} نقاط</b> من كل كفاءة.`,
  cfOk:cf=>`معامل التصحيح لديك <b>${cf}</b> (19 أو أقل)، أي أن إجاباتك متوازنة، و<b>لم يلزم أي تصحيح</b>.`,
  sheet:"عرض ورقة الدرجات كاملة", thComp:"الكفاءة", thScore:"الدرجة", thCorr:"التصحيح", thCorrected:"بعد التصحيح", total:"المجموع",
  share:"مشاركة نتيجتي", retake:"إعادة الاختبار",
  note:"تبقى إجاباتك على هذا الجهاز فقط، وتُمحى عند تحديث الصفحة.",
  copied:"تم النسخ إلى الحافظة، وأصبحت النتيجة جاهزة للمشاركة.",
  shareText:(type,total,tier,tops)=>`نمطي الريادي في اختبار الكفاءات الريادية: ${type} (${total}/250، مستوى ${tier}). أبرز نقاط قوتي: ${tops}. رابط الاختبار:`,
  sep:"، "
}};

const PER = 11;
const $ = id => document.getElementById(id);
let lang = "en", ans = new Array(55).fill(0), idx = 0, busy = false, result = null;
const t = () => T[lang];

/* ===== Language ===== */
function pickInitialLang(){
  const h = (location.hash||"").replace("#","").toLowerCase();
  if(h==="ar"||h==="en") return h;
  try{ const s = localStorage.getItem("pec-lang"); if(s==="ar"||s==="en") return s; }catch(e){}
  return (navigator.language||"").toLowerCase().startsWith("ar") ? "ar" : "en";
}
function setLang(l){
  lang = l;
  const root = document.documentElement;
  root.lang = l; root.dir = l==="ar" ? "rtl" : "ltr";
  document.title = t().title;
  try{ localStorage.setItem("pec-lang", l); }catch(e){}
  $("langEn").setAttribute("aria-pressed", l==="en");
  $("langAr").setAttribute("aria-pressed", l==="ar");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML = t()[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{ el.setAttribute("aria-label", t()[el.dataset.i18nAria]); });
  $("chips").innerHTML = P[l].map(p=>`<span class="chip">${p.short}</span>`).join("");
  $("scaleHint").innerHTML = t().scale.map((s,i)=>`<div><b>${i+1}</b>${s}</div>`).join("");
  document.querySelectorAll(".ans span").forEach((s,i)=> s.textContent = t().scale[i]);
  $("answers").setAttribute("aria-label", t().rating);
  if(!$("results").hidden || !result) $("shareNote").textContent = t().note;
  if(!$("quiz").hidden) render(null);
  if(!$("results").hidden && result) renderResults(false);
}

/* ===== Quiz ===== */
$("stages").innerHTML = Array.from({length:5},()=>'<div class="stage"><span></span></div>').join("");
$("answers").innerHTML = [1,2,3,4,5].map(v=>`<button class="ans" type="button" data-v="${v}" id="ans${v}"><b>${v}</b><span></span></button>`).join("");

function show(id){ ["intro","quiz","results"].forEach(s=>$(s).hidden = s!==id); window.scrollTo({top:0}); }

function render(dir){
  const card = $("card");
  $("qnum").textContent = t().qnum(idx+1);
  $("qtext").textContent = Q[lang][idx];
  $("count").innerHTML = (idx+1) + "<small>/55</small>";
  const st = Math.floor(idx/PER);
  $("stageLabel").textContent = t().stage(st+1, t().stages[st]);
  document.querySelectorAll(".stage").forEach((el,i)=>{
    const answered = ans.slice(i*PER,(i+1)*PER).filter(Boolean).length;
    el.querySelector("span").style.width = (answered/PER*100)+"%";
    el.classList.toggle("done", answered===PER);
  });
  document.querySelectorAll(".ans").forEach(b=>b.classList.toggle("sel", +b.dataset.v===ans[idx]));
  $("backBtn").disabled = idx===0;
  if(dir){ card.classList.remove("in","back"); void card.offsetWidth; card.classList.add(dir==="back"?"back":"in"); }
}

function answer(v){
  if(busy) return;
  busy = true;
  ans[idx] = v;
  const b = $("ans"+v);
  document.querySelectorAll(".ans").forEach(x=>x.classList.toggle("sel", x===b));
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
  const st = Math.floor(idx/PER);
  const stageNowDone = ans.slice(st*PER,(st+1)*PER).every(Boolean);
  setTimeout(()=>{
    busy = false;
    if(ans.every(Boolean) && idx===54){ finish(); return; }
    if(stageNowDone && (idx+1)%PER===0 && idx<54) toast(st+1, t().toastT(st+1), t().toastS(t().stages[st+1], 55-(idx+1)));
    let n = idx+1;
    if(n>54){ n = ans.findIndex(a=>!a); if(n<0){ finish(); return; } }
    idx = n; render("in");
  }, 230);
}

function back(){ if(idx>0 && !busy){ idx--; render("back"); } }

let tt;
function toast(n,title,sub){
  $("toastMedal").textContent = n; $("toastTitle").textContent = title; $("toastSub").textContent = sub;
  const el = $("toast"); el.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* ===== Scoring ===== */
const calc = (f,k) => f.reduce((s,n)=> s + (n>0 ? ans[n-1] : -ans[-n-1]), 0) + k;
const correctionNumber = cf => cf>=24?7 : cf>=22?5 : cf>=20?3 : 0;
const level = v => v>=20?"strong" : v>=15?"solid" : "grow";

function finish(){
  const cf = calc(CF.f, CF.k), corr = correctionNumber(cf);
  const rows = F.map((p,i)=>{ const raw = calc(p.f,p.k); return {i, raw, cor: Math.max(0, raw-corr)}; });
  const total = rows.reduce((s,r)=>s+r.cor,0), rawTotal = rows.reduce((s,r)=>s+r.raw,0);
  const sorted = [...rows].sort((a,b)=> b.cor-a.cor || a.i-b.i);
  const ti = total>=210?3 : total>=180?2 : total>=150?1 : 0;
  result = {cf, corr, rows, total, rawTotal, sorted, ti};
  $("shareNote").textContent = t().note;
  show("results");
  renderResults(true);
}

function renderResults(animate){
  const {cf, corr, rows, total, rawTotal, sorted, ti} = result;
  const L = P[lang], top = sorted[0];
  $("archetype").textContent = L[top.i].type;
  $("archetypeDesc").textContent = L[top.i].d + t().topIs(L[top.i].name);
  $("tierName").textContent = t().level(ti+1, t().tiers[ti]);
  $("tierRow").textContent = t().tiers.join(" · ");
  document.querySelectorAll("#tierBar i").forEach((el,i)=>el.classList.toggle("on", i<=ti));

  $("profile").innerHTML = '<svg class="link" aria-hidden="true"><polyline id="poly" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/></svg>' +
    rows.map(r=>`<div class="prow lv-${level(r.cor)}"><div class="plabel"><span>${L[r.i].name}</span><span class="val">${r.cor}</span></div>
      <div class="track" role="img" aria-label="${t().of25(L[r.i].name, r.cor)}"><div class="fill"></div><div class="dot">✕</div></div></div>`).join("");

  const item = (r,cls,text) => `<li><div class="badge ${cls}">${r.cor}</div><div><b>${L[r.i].name}</b><p>${text}</p></div></li>`;
  $("strengths").innerHTML = sorted.slice(0,3).map(r=>item(r,"s",L[r.i].s)).join("");
  $("growth").innerHTML = sorted.slice(-3).reverse().map(r=>item(r,"g",L[r.i].tip)).join("");

  const g = $("gauge");
  g.style.setProperty("--p", Math.round((cf-5)/20*100));
  g.style.setProperty("--hc", corr ? "var(--accent)" : "var(--good)");
  $("cfNum").textContent = cf;
  $("cfText").innerHTML = corr ? t().cfHigh(cf,corr) : t().cfOk(cf);

  $("sheet").innerHTML = rows.map(r=>`<tr><td>${L[r.i].name}</td><td>${r.raw}</td><td class="num">−${corr}</td><td>${r.cor}</td></tr>`).join("");
  $("tRaw").textContent = rawTotal; $("tCor").textContent = total;

  const place = () => {
    document.querySelectorAll(".prow").forEach((row,i)=>{
      const pct = rows[i].cor/25*100;
      row.querySelector(".fill").style.width = pct+"%";
      row.querySelector(".dot").style.left = pct+"%";
    });
  };
  if(animate){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      place(); countUp($("totalNum"), total);
      drawLink(); setTimeout(drawLink, 1050);
      confetti();
    }));
  } else {
    document.querySelectorAll(".fill,.dot").forEach(el=>el.style.transition="none");
    place(); $("totalNum").textContent = total; drawLink();
  }
}

function drawLink(){
  const prof = $("profile"), poly = $("poly");
  if(!prof || !poly || $("results").hidden) return;
  const base = prof.getBoundingClientRect();
  const pts = [...prof.querySelectorAll(".dot")].map(d=>{
    const r = d.getBoundingClientRect();
    return (r.left+r.width/2-base.left).toFixed(1)+","+(r.top+r.height/2-base.top).toFixed(1);
  });
  poly.setAttribute("points", pts.join(" "));
}
window.addEventListener("resize", drawLink);

function countUp(el, to){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = to; return; }
  const t0 = performance.now(), d = 1100;
  (function step(now){ const p = Math.min(1,(now-t0)/d); el.textContent = Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); })(t0);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), ctx = c.getContext("2d"); c.hidden = false;
  const dpr = devicePixelRatio || 1;
  const W = c.width = innerWidth*dpr, H = c.height = innerHeight*dpr;
  const css = getComputedStyle(document.documentElement);
  const cols = ["--accent","--sky","--good","--gold"].map(v=>css.getPropertyValue(v).trim());
  const parts = Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.35,vx:(Math.random()-.5)*26*dpr,vy:(-Math.random()*22-6)*dpr,
    s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*4)]}));
  const t0 = performance.now();
  (function frame(now){
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{ p.vy += .7*dpr; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(now-t0<2600) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); c.hidden = true; }
  })(t0);
}

async function share(){
  const {total, sorted, ti} = result, L = P[lang];
  const text = t().shareText(L[sorted[0].i].type, total, t().tiers[ti], sorted.slice(0,3).map(r=>L[r.i].short).join(t().sep));
  const url = location.href.split("#")[0] + "#" + lang;
  const note = $("shareNote");
  if(navigator.share){
    try{ await navigator.share({title:t().title, text, url}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(text+" "+url); note.textContent = t().copied; }
  catch(e){ note.textContent = text+" "+url; }
}

/* ===== Events ===== */
$("langEn").addEventListener("click", ()=>setLang("en"));
$("langAr").addEventListener("click", ()=>setLang("ar"));
$("startBtn").addEventListener("click", ()=>{ show("quiz"); render("in"); });
$("answers").addEventListener("click", e=>{ const b = e.target.closest(".ans"); if(b) answer(+b.dataset.v); });
$("backBtn").addEventListener("click", back);
$("retakeBtn").addEventListener("click", ()=>{ ans.fill(0); idx = 0; result = null; $("shareNote").textContent = t().note; show("intro"); });
$("shareBtn").addEventListener("click", share);
document.addEventListener("keydown", e=>{
  if($("quiz").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const backKey = lang==="ar" ? "ArrowRight" : "ArrowLeft";
  if(e.key>="1" && e.key<="5"){ e.preventDefault(); answer(+e.key); }
  else if(e.key===backKey || e.key==="Backspace"){ e.preventDefault(); back(); }
});

setLang(pickInitialLang());
})();
</script>
</body>
</html>
